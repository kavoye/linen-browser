name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  PROJECT: Linen.xcodeproj
  SCHEME: Linen
  APP: Linen
  TEAM_ID: T8677WC8DG
  XCODE: '26.6'
  DD: ${{ github.workspace }}/build/DD

jobs:
  # A cheap runner reads the mark that the push to main already left. Tests are
  # never run twice for one commit, and no signing secret is reachable until
  # this passes. The tag may be pushed while CI is still running.
  gate:
    name: Wait for green
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # A tag can point at any commit, including one that never went through a
      # pull request. Releases only come from the default branch.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          # HEAD, not GITHUB_SHA: an annotated tag is its own object.
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main."
            exit 1
          fi

      - name: Wait for the tests to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          for _ in $(seq 1 90); do
            STATE="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "Build and test") | "\(.status) \(.conclusion)"' \
              | head -1)"
            case "$STATE" in
              "completed success")
                echo "$SHA passed."
                exit 0
                ;;
              completed*)
                echo "::error::Build and test ${STATE#completed } on $SHA."
                exit 1
                ;;
              "")
                echo "No Build and test run on $SHA yet."
                ;;
              *)
                echo "Build and test is ${STATE% *}."
                ;;
            esac
            sleep 30
          done
          echo "::error::Build and test did not finish on $SHA."
          exit 1

  release:
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60

    # Every signing secret belongs to this environment, not to the repository.
    # Who may create a `v*` tag is a ruleset, not a reviewer on this job.
    environment: release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"

      # No `restore-keys`, unlike CI: this job compiles what it restores into
      # a signed build, so the cache must match the exact `Package.resolved`.
      # A miss costs one fresh resolve.
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/DD/SourcePackages
          key: spm-${{ hashFiles('Linen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" -derivedDataPath "$DD"

      - name: Check acknowledgements
        run: |
          swift Tools/make-acknowledgements.swift "$DD/SourcePackages/checkouts"
          if ! git diff --quiet -- Linen/Support/Acknowledgements.json; then
            echo "::error file=Linen/Support/Acknowledgements.json::Out of date. Run: swift Tools/make-acknowledgements.swift"
            exit 1
          fi

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"
          # Sparkle orders updates by this number, and it must never go back.
          # A run counter restarts if the workflow file is ever replaced; the
          # commit count cannot, and it rises across both channels.
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN"

      # The app signs `keychain-access-groups`, which a Developer ID signature
      # may only carry when a profile authorises it. Without the profile
      # Gatekeeper refuses to launch the app at all - "Unsatisfied
      # entitlements" - so this is a hard requirement, not a nicety.
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROVISIONING_PROFILE" ]; then
            echo "::error::DEVELOPER_ID_PROVISIONING_PROFILE is not set. See RELEASING.md."
            exit 1
          fi

          DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$DIR"
          PROFILE="$DIR/$APP.provisionprofile"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"

          NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw -o - -)"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed $NAME"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/"$APP".xcarchive \
            -derivedDataPath "$DD" \
            -skipMacroValidation -skipPackagePluginValidation \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            LINEN_PROFILE="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kavoye.Linen</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/"$APP".xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

          codesign --verify --deep --strict --verbose=2 "build/export/$APP.app"

          # Both halves of the keychain grant, checked before the 30-minute
          # notarisation rather than by the `spctl` assessment after it.
          if [ ! -f "build/export/$APP.app/Contents/embedded.provisionprofile" ]; then
            echo "::error::No embedded profile. Gatekeeper will refuse to launch the app."
            exit 1
          fi
          codesign -d --entitlements - --xml "build/export/$APP.app" 2>/dev/null \
            | plutil -extract keychain-access-groups raw -o - - > /dev/null 2>&1 \
            || { echo "::error::keychain-access-groups is missing: API keys cannot be saved."; exit 1; }

      - name: Notarize and staple
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/$APP.app" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 30m

          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"

          xcrun stapler staple "build/export/$APP.app"
          spctl --assess --type execute --verbose=4 "build/export/$APP.app"

      # `dist` holds the Sparkle asset and nothing else: `generate_appcast`
      # scans that folder and reads a `.dmg` as readily as a `.zip`, which
      # would put two items for one version in the feed.
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/$APP.app" \
            "dist/$APP-${{ steps.version.outputs.version }}.zip"

      # The zip is what Sparkle updates from; the disk image is what a person
      # downloads. The Applications symlink is the whole point of it - a copy
      # made in the Finder is what clears the quarantine flag, and an app that
      # keeps running from ~/Downloads cannot update itself at all.
      # Only Finder writes a .DS_Store, and the runner has no Finder session, so
      # the window layout is made on a Mac by Tools/make-dmg-layout.sh and
      # committed. The volume name must stay Linen: the background is an alias
      # that names the volume.
      - name: Build the disk image
        id: dmg
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.background" build/dmg
          ditto "build/export/$APP.app" "$STAGE/$APP.app"
          ln -s /Applications "$STAGE/Applications"
          cp Tools/dmg/background.tiff "$STAGE/.background/background.tiff"
          cp Tools/dmg/DS_Store "$STAGE/.DS_Store"

          DMG="build/dmg/$APP-${{ steps.version.outputs.version }}.dmg"
          hdiutil create -volname "$APP" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

          codesign --force --sign "Developer ID Application" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"

      # The app inside carries its own ticket already. This one is for the
      # container: without it a first mount with no network has nothing to
      # check, and Gatekeeper refuses the image.
      - name: Notarize and staple the disk image
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          echo "$AC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 30m

          rm -f "$RUNNER_TEMP/AuthKey.p8"

          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Sign for Sparkle and build the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          BIN="$(dirname "$(find "$DD/SourcePackages/artifacts" -type f -name generate_appcast -print -quit)")"
          echo "$SPARKLE_PRIVATE_KEY" | "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            --full-release-notes-url "https://github.com/${{ github.repository }}/releases" \
            --link "https://github.com/${{ github.repository }}" \
            dist

          rm -rf dist/old_updates
          cat dist/appcast.xml

      # The changelog says what changed; GitHub's own notes say who changed it,
      # and carry the New Contributors section. Both, in that order - a
      # `--notes-file` replaces the generated notes rather than joining them,
      # so writing a changelog entry used to drop every contributor silently.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build
          : > build/notes.md

          if [ -f CHANGELOG.md ]; then
            awk -v want="## $VERSION" '
              index($0, want) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md >> build/notes.md
            printf '\n' >> build/notes.md
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body >> build/notes.md

          cat build/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          gh release create "$TAG" \
            --title "$VERSION" \
            --notes-file build/notes.md \
            "$DMG" \
            "dist/$APP-$VERSION.zip" \
            dist/appcast.xml

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
