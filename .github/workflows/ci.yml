name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ten commits in ten minutes build once, and always the last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Linen.xcodeproj
  SCHEME: Linen
  APP: Linen
  TEAM_ID: T8677WC8DG
  XCODE: '27.2'
  DD: ${{ github.workspace }}/build/DD
  TIP: tip
  # The macOS runner image carries no SwiftLint. Pinned so a new release cannot
  # add a rule that fails a build nobody changed.
  SWIFTLINT: '0.65.1'
  SWIFTLINT_SHA256: 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A skipped job still counts as passed for a required check. The release
      # gate accepts a skip only when this job succeeded.
      - name: Check for files other than docs
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE="$(git diff --name-only "$BASE" HEAD -- . \
            ':(exclude,glob)**/*.md' \
            ':(exclude).github/assets' \
            ':(exclude)LICENSE' \
            | head -1)"
          if [ -n "$CODE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ env.XCODE }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"

      - name: Install Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: Install SwiftLint ${{ env.SWIFTLINT }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          sudo install "$RUNNER_TEMP/swiftlint/swiftlint" /usr/local/bin/swiftlint
          test "$(/usr/local/bin/swiftlint version)" = "$SWIFTLINT"
          echo /usr/local/bin >> "$GITHUB_PATH"

      - name: Check format
        run: Tools/check-format.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DD/SourcePackages
          key: spm-${{ hashFiles('Linen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" -derivedDataPath "$DD" \
            -IDEPackageEnablePrebuilts=NO \
            -onlyUsePackageVersionsFromResolvedFile

      # MIT and Apache both require their terms to travel with the binary, and
      # a signed app is a redistribution. The app shows this file, so it has to
      # match what the app actually links.
      - name: Check acknowledgements
        run: |
          swift Tools/make-acknowledgements.swift "$DD/SourcePackages/checkouts"
          if ! git diff --quiet -- Linen/Resources/Acknowledgements.json; then
            echo "::error file=Linen/Resources/Acknowledgements.json::Out of date. Run: swift Tools/make-acknowledgements.swift"
            git diff --stat -- Linen/Resources/Acknowledgements.json
            exit 1
          fi

      # No entitlements: `keychain-access-groups` needs a provisioning profile,
      # and demanding one here would mean a signing certificate for every test
      # run. Nothing under test reaches the keychain.
      # Xcode 27 runner VMs cannot load Vision's OCR backend, even with CPU selection.
      # Exclude only these four integration tests in CI; they remain enabled locally.
      # Remove these exclusions when the runner image supports Vision OCR.
      # The same VMs return exact canvas pixels even when WebKit is asked to add
      # noise, so the readback check runs only locally. tabsAskWebKitToAddCanvasNoise
      # still checks the setting in CI.
      - name: Test
        run: |
          python3 Tools/run-xcodebuild-with-watchdog.py -- xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DD" \
            -IDEPackageEnablePrebuilts=NO \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -disableAutomaticPackageResolution \
            -skipMacroValidation -skipPackagePluginValidation \
            '-skip-testing:LinenTests/AttachmentTests/normalizesImagesAndRecognizesText()' \
            '-skip-testing:LinenTests/AttachmentTests/recognizesTextWithoutANeuralEngine()' \
            '-skip-testing:LinenTests/AttachmentTests/recognizesScannedPDFPages()' \
            '-skip-testing:LinenTests/AttachmentTests/pastingAnImageCreatesARemovableAttachment()' \
            '-skip-testing:LinenTests/WebViewConfigurationTests/pagesReadBackANoisyCanvas()' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=

      - name: Export performance metrics
        if: always()
        run: |
          if [ -f build/TestResults.xcresult/Info.plist ]; then
            xcrun xcresulttool get test-results metrics \
              --path build/TestResults.xcresult --compact \
              > build/performance-metrics.json
          fi

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestDiagnostics
          path: build/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Check performance budgets
        run: Tools/check-performance.sh build/performance-metrics.json

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PerformanceMetrics
          path: build/performance-metrics.json
          if-no-files-found: ignore
          retention-days: 14

      # An .xcresult is a bundle. Uploaded as a directory it arrives as loose
      # files that neither Xcode nor xcresulttool will open.
      - name: Package test results
        if: failure()
        run: |
          if [ -f build/TestResults.xcresult/Info.plist ]; then
            ditto -c -k --keepParent build/TestResults.xcresult build/TestResults.xcresult.zip
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: build/TestResults.xcresult.zip
          if-no-files-found: ignore

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CrashReports
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 14

  version:
    name: Read version
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      marketing: ${{ steps.compute.outputs.marketing }}
      file: ${{ steps.compute.outputs.file }}
      number: ${{ steps.compute.outputs.number }}
      base: ${{ steps.compute.outputs.base }}
      docs: ${{ steps.compute.outputs.docs }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version from the last tag
        id: compute
        env:
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          # `--match` excludes the rolling `tip` tag, which is also on main and
          # would otherwise collapse the count to zero on every build.
          BASE="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)"
          COUNT="$(git rev-list --count "$BASE"..HEAD 2>/dev/null || git rev-list --count HEAD)"

          SHORT="${BASE#v}"
          if [ "$COUNT" -eq 0 ]; then
            # A release tag sits on this commit. The preview feed is a feed of
            # its own, and a release never writes to it, so the build still has
            # to go out or the preview channel keeps the release before this one.
            MARKETING="$SHORT"
            FILE="$SHORT"
          else
            # `+` is semver's build metadata. The About panel adds the build
            # number in brackets of its own, so brackets here read as two.
            MARKETING="$SHORT+$COUNT"
            FILE="$SHORT-$COUNT"
          fi

          echo "marketing=$MARKETING"                    >> "$GITHUB_OUTPUT"
          echo "file=$FILE"                              >> "$GITHUB_OUTPUT"
          # Sparkle orders updates by this number, and it must never go back.
          # It counts every commit, so a release always sorts above the previews
          # before it.
          echo "number=$(git rev-list --count HEAD)"     >> "$GITHUB_OUTPUT"
          echo "base=$BASE"                              >> "$GITHUB_OUTPUT"

          if [ "$CODE" != "true" ] && [ "$COUNT" -ne 0 ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs beside the tests with no secrets, so a red commit never reaches a key.
  archive:
    name: Archive
    needs: version
    if: needs.version.outputs.docs != 'true'
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ env.XCODE }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"

      - name: Install Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DD/SourcePackages
          key: spm-${{ hashFiles('Linen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" -derivedDataPath "$DD" \
            -IDEPackageEnablePrebuilts=NO \
            -onlyUsePackageVersionsFromResolvedFile

      # Xcode refuses restricted entitlements without a profile, and export keeps
      # only what the ad-hoc signature carries. Package targets ignore the
      # project's ARCHS, so it has to be set here.
      - name: Archive
        run: |
          ENTITLEMENTS="$RUNNER_TEMP/$APP.entitlements"
          cp "$APP/Resources/$APP.entitlements" "$ENTITLEMENTS"
          plutil -remove 'keychain-access-groups' "$ENTITLEMENTS"
          plutil -remove 'com\.apple\.developer\.web-browser\.public-key-credential' "$ENTITLEMENTS"

          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/"$APP".xcarchive \
            -derivedDataPath "$DD" \
            -IDEPackageEnablePrebuilts=NO \
            -disableAutomaticPackageResolution \
            -skipMacroValidation -skipPackagePluginValidation \
            ARCHS=arm64 \
            MARKETING_VERSION="${{ needs.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS"

          PRODUCT="build/$APP.xcarchive/Products/Applications/$APP.app"
          codesign -d --entitlements - --xml "$PRODUCT" 2>/dev/null > "$ENTITLEMENTS"
          plutil -insert 'keychain-access-groups' -json "[\"$TEAM_ID.com.kavoye.$APP\"]" "$ENTITLEMENTS"
          plutil -insert 'com\.apple\.developer\.web-browser\.public-key-credential' -bool YES "$ENTITLEMENTS"
          codesign --force --sign - --options runtime --entitlements "$ENTITLEMENTS" "$PRODUCT"

      # A zip would flatten the framework symlinks and break the signature.
      - name: Package the archive
        run: tar -cf build/"$APP".xcarchive.tar -C build "$APP".xcarchive

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UnsignedArchive
          path: build/${{ env.APP }}.xcarchive.tar
          if-no-files-found: error
          retention-days: 1

  # A docs-only commit skips the tests but still publishes when it is a release.
  publish:
    name: Sign and publish
    needs: [changes, test, version, archive]
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      needs.archive.result == 'success' &&
      (needs.test.result == 'success' ||
       (needs.test.result == 'skipped' && needs.changes.outputs.code == 'false'))
    runs-on: xcode-27
    timeout-minutes: 45

    environment: release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DD/SourcePackages
          key: spm-${{ hashFiles('Linen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" -derivedDataPath "$DD" \
            -IDEPackageEnablePrebuilts=NO \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: UnsignedArchive
          path: build

      - name: Unpack the archive
        run: tar -xf build/"$APP".xcarchive.tar -C build

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROVISIONING_PROFILE" ]; then
            echo "::error::DEVELOPER_ID_PROVISIONING_PROFILE is not set. See RELEASING.md."
            exit 1
          fi

          DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$DIR"
          PROFILE="$DIR/$APP.provisionprofile"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"

          NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw -o - -)"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Export
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kavoye.Linen</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/"$APP".xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

          codesign --verify --deep --strict --verbose=2 "build/export/$APP.app"

          if [ ! -f "build/export/$APP.app/Contents/embedded.provisionprofile" ]; then
            echo "::error::No embedded profile. Gatekeeper will refuse to launch the app."
            exit 1
          fi
          codesign -d --entitlements - --xml "build/export/$APP.app" 2>/dev/null \
            | plutil -extract keychain-access-groups raw -o - - > /dev/null 2>&1 \
            || { echo "::error::keychain-access-groups is missing: API keys cannot be saved."; exit 1; }
          codesign -d --entitlements - --xml "build/export/$APP.app" 2>/dev/null \
            | plutil -extract 'com\.apple\.developer\.web-browser\.public-key-credential' raw -o - - > /dev/null 2>&1 \
            || { echo "::error::web-browser.public-key-credential is missing: passkeys cannot be used."; exit 1; }

      # There is no disk image. A preview build only ever arrives through
      # Sparkle, and skipping it also skips a second notarisation.
      - name: Notarize and staple
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/$APP.app" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 30m

          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"

          xcrun stapler staple "build/export/$APP.app"
          spctl --assess --type execute --verbose=4 "build/export/$APP.app"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/export/$APP.app" \
            "dist/$APP-${{ needs.version.outputs.file }}.zip"

      - name: Sign for Sparkle and build the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          BIN="$(dirname "$(find "$DD/SourcePackages/artifacts" -type f -name generate_appcast -print -quit)")"
          echo "$SPARKLE_PRIVATE_KEY" | "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TIP/" \
            --full-release-notes-url "https://github.com/${{ github.repository }}/commits/main" \
            --link "https://github.com/${{ github.repository }}" \
            dist

          rm -rf dist/old_updates
          # The name must differ from the stable feed. See UpdateFeed.swift.
          mv dist/appcast.xml dist/appcast-tip.xml
          cat dist/appcast-tip.xml

      # One rolling pre-release. `--prerelease` is what keeps it out of
      # `releases/latest`, which the stable feed URL resolves through.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          MARKETING: ${{ needs.version.outputs.marketing }}
          FILE: ${{ needs.version.outputs.file }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          git tag -f "$TIP" "$SHA"
          git push -f origin "refs/tags/$TIP"

          # GitHub's own generated notes list pull requests, and this
          # repository pushes to main. The range is the one the version
          # counts: every commit since the last release.
          LIMIT=20
          TOTAL="$(git rev-list --count --no-merges "$BASE"..HEAD)"

          mkdir -p build
          {
            if [ "$TOTAL" -eq 0 ]; then
              printf 'This preview is release %s itself. Nothing has landed on main since.\n\n' "$BASE"
            else
              git log --no-merges --max-count="$LIMIT" \
                --pretty=format:"- %s ([%h](https://github.com/$GITHUB_REPOSITORY/commit/%H))" \
                "$BASE"..HEAD
              printf '\n'
              if [ "$TOTAL" -gt "$LIMIT" ]; then
                printf '\n…and %s more.\n' "$((TOTAL - LIMIT))"
              fi
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n\n' \
                "$GITHUB_REPOSITORY" "$BASE" "$TIP"
            fi
            cat <<'NOTES'
          Preview builds come from the newest commit on main. They get less
          testing than a release. To receive them, set **Update channel** to
          **Preview** in Settings, under About.
          NOTES
          } > build/notes.md
          cat build/notes.md

          if gh release view "$TIP" > /dev/null 2>&1; then
            gh release edit "$TIP" --prerelease \
              --title "Preview $MARKETING" --notes-file build/notes.md
          else
            gh release create "$TIP" --prerelease \
              --title "Preview $MARKETING" --notes-file build/notes.md
          fi

          gh release upload "$TIP" "dist/$APP-$FILE.zip" --clobber
          gh release upload "$TIP" dist/appcast-tip.xml --clobber

          # Old builds stay long enough that a download in flight still lands.
          # `head -n -5` is a GNU extension, and the runner is a Mac.
          gh release view "$TIP" --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[].name' \
            | grep "^$APP-.*\.zip$" | tail -n +6 \
            | while read -r asset; do
                echo "Deleting $asset"
                gh release delete-asset "$TIP" "$asset" -y
              done

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
